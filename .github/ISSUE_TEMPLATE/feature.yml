name: Feature proposal
description: Propose a measurable user outcome without prematurely fixing the implementation.
title: "[Feature]: "
labels:
  - "type: feature"
  - "status: triage"
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and evidence
      description: Who experiences the problem, in what context, and what evidence shows it is worth solving?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe what should become possible and how success will be measured.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Use observable Given/When/Then examples, including important failure or recovery paths.
      placeholder: |
        - Given ..., when ..., then ...
    validations:
      required: true
  - type: textarea
    id: non_goals
    attributes:
      label: Non-goals
      description: Name adjacent work intentionally excluded from this feature.
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints and risks
      description: Include compatibility, data, privacy, security, accessibility, operational, cost, or schedule constraints.
  - type: textarea
    id: alternatives
    attributes:
      label: Current workaround or alternatives
      description: Explain how users cope today and any simpler solution already considered.
  - type: checkboxes
    id: hygiene
    attributes:
      label: Submission checks
      options:
        - label: I searched for an existing proposal and did not include secrets or private data.
          required: true
